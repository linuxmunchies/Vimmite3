[Unit]
StartLimitIntervalSec=15min
StartLimitBurst=6

[Service]
Restart=on-failure
RestartSec=1min
# A single large install transaction can briefly consider a late app's
# runtimes unused and remove them before deploying the app. Updating once
# after reconciliation restores any missing related refs; failure also feeds
# into the retry policy above.
ExecStartPost=/usr/bin/flatpak update --system --noninteractive
