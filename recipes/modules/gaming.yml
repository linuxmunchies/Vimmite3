---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      packages:
        # kinoite-main already carries the Fedora Multimedia repository used
        # for native Steam, so Vimmite3 does not add a gaming repository.
        - steam
        - mangohud.x86_64
        - mangohud.i686

  # Steam weakly recommends GameMode. Remove it in a separate transaction so
  # DNF cannot satisfy that recommendation again during the install above.
  - type: dnf
    remove:
      packages:
        - gamemode

  # Lossless Scaling is not in a stable Fedora repository. Verify the pinned
  # upstream RPM before installing it into the image.
  - type: script
    scripts:
      - install-lossless-scaling.sh
